판:
  이름: 140벡터화
  가지: A4
  시도: 칠한 선 화소를 꼭짓점에서 끊어 선 목록으로 바꾼다
  명제: 판 137 이 칠한 시험 부품 299 개의 선 화소를 뼈대 · 꼭짓점 · 가지 · 휨 계산만으로 선 목록으로 바꾸면, 정답 모서리(CAD
    투영)의 90 % 이상과 2 화소 안에서 짝이 맞고(정밀도 함께 F1 0.90) 짝 맞은 선의 종류(눈 기준 · 2 화소 이상 휨 = 원호)가
    90 % 이상 맞으며 한 모서리를 1.2 조각 넘게 쪼개지 않는다. 같은 계산을 정답 선지도에 돌리면 F1 0.95 를 넘어 계산 자체는 믿을
    만하다
  물음: 칠한 화소에서 선 목록을 계산만으로 뽑을 수 있나
  종류: 탐색
