  시도: 끊긴 점선과 쪼개진 원호를 한 선으로 잇는다
  명제: 140 과 같은 입력(판 137 선지도 · 시험 299)에서 마디를 봉우리 한 화소로 줄이고 같은 방향 직선 토막과 원 하나에 맞는 조각을
    이으면, 정답 모서리 재현이 0.74 에서 올라 F1 0.90 을 넘고 한 선으로 뽑힌 모서리가 0.60 에서 0.80 을 넘으며 종류 0.90
    을 지킨다. 같은 계산을 정답 선지도에 돌린 천장 F1 도 0.95 를 넘는다
  물음: 140 의 놓침과 쪼개짐은 잇기 규칙이 없어서인가
