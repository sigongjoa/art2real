<!doctype html>
<html><head><meta charset="utf-8"><title>틈새 삼각형</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// 1-4 틈새 삼각형(Kellman & Shipley 1991 그림6) — 공원 미닫이 울타리 문 뒤에 주황 삼각 텐트. 좁은 틈으로는 띠만 보이는데 눈은 삼각형을 안다 · 문을 열면 온전한 텐트.
// 장소: 공원 항공 → 울타리 앞 → 틈으로 엿보기 → 레일 바퀴 → 띠 하나 → 고양이 → 열린 문 → 드론 → 텐트 → 노을.
import { THREE, V, clamp01, ease, rnd, std, mesh, canvasTex, 시간, 무대, 공원, 고양이, 모션 } from './공용.js';
const T = window.__T, { U, after, cutAt } = 시간(T);
const { scene, camera, renderer, 노을, 찍기 } = 무대(), 숲 = 공원(scene), M = (g, m, p, parent) => mesh(scene, g, m, p, parent);

// 주황 삼각 텐트(앞면 삼각형: 밑변 x -1.6..1.6, 꼭짓점 y 2.8, 앞면 z = -2)
const TZ = -2, TW = 1.6, TH = 2.8, tri = [V(-TW, 0, TZ), V(TW, 0, TZ), V(0, TH, TZ)];
const tent = new THREE.Group(); scene.add(tent);
const sh = new THREE.Shape([new THREE.Vector2(-TW, 0), new THREE.Vector2(TW, 0), new THREE.Vector2(0, TH)]);
M(new THREE.ExtrudeGeometry(sh, { depth: 3, bevelEnabled: false }).translate(0, 0, -3), std(0xf08a2c, 0.7), [0, 0, TZ], tent);
const doorSh = new THREE.Shape([new THREE.Vector2(-0.6, 0), new THREE.Vector2(0.6, 0), new THREE.Vector2(0, 1.5)]);
M(new THREE.ShapeGeometry(doorSh), std(0xb85a17, 0.8), [0, 0.01, TZ + 0.01], tent);
M(new THREE.CylinderGeometry(0.03, 0.03, 0.7), std(0x5a4632, 0.7), [0, TH + 0.3, TZ - 0.1], tent);
M(new THREE.PlaneGeometry(0.4, 0.25), new THREE.MeshStandardMaterial({ color: 0x3f8ad8, side: THREE.DoubleSide }), [0.2, TH + 0.5, TZ - 0.1], tent);
for (const s of [-1, 1]) { const a = V(s * TW * 0.55, TH * 0.45, TZ), b = V(s * (TW + 1.1), 0, TZ + 0.6), d = b.clone().sub(a);       // 줄 · 말뚝
  const r = M(new THREE.CylinderGeometry(0.01, 0.01, d.length(), 4), std(0xeee8d8, 0.8), [0, 0, 0], tent); r.position.copy(a).addScaledVector(d, 0.5); r.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  M(new THREE.CylinderGeometry(0.03, 0.02, 0.2, 6), std(0x777777, 0.5, 0.6), [b.x, 0.08, b.z], tent); }
// 모닥불 · 통나무 의자(장소 느낌)
for (let k = 0; k < 5; k++) M(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 8), std(0x7a5236, 0.8), [2.8 + 0.2 * Math.cos(k * 1.26), 0.06, TZ + 1.2 + 0.2 * Math.sin(k * 1.26)], tent).rotation.set(Math.PI / 2, 0, k * 1.26);
const fire = M(new THREE.ConeGeometry(0.16, 0.4, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(9, 4, 0.8) }), [2.8, 0.25, TZ + 1.2], tent);
M(new THREE.CylinderGeometry(0.25, 0.25, 0.45, 12), std(0x9a6a43, 0.8), [-2.9, 0.22, TZ + 1.3], tent);

// 미닫이 울타리 문: 세로 널 0.3 m · 틈 0.08 m · 높이 3.4 · 폭 8 m, 레일 위 바퀴
const gate = new THREE.Group(); scene.add(gate);
const slatM = std(0xf4efe6, 0.6), frameM = std(0x6c7a86, 0.5, 0.4), SL = 0.3, GAP = 0.08;
for (let x = -4; x < 4; x += SL + GAP) M(new THREE.BoxGeometry(SL, 3.4, 0.06), slatM, [x + SL / 2, 1.85, 0], gate);
for (const y of [0.35, 3.35]) M(new THREE.BoxGeometry(8.2, 0.08, 0.1), frameM, [0, y, 0.06], gate);
const wheels = [-3.4, -1, 1, 3.4].map(x => M(new THREE.CylinderGeometry(0.12, 0.12, 0.06, 16).rotateX(Math.PI / 2), std(0xa9b1b8, 0.3, 0.8), [x, 0.12, 0.07], gate));
M(new THREE.BoxGeometry(24, 0.04, 0.12), std(0x8b939b, 0.3, 0.8), [4, 0.02, 0]);                          // 레일
for (const x of [-4.2, 12.2]) M(new THREE.BoxGeometry(0.2, 3.6, 0.2), frameM, [x, 1.8, -0.1]);          // 기둥

const 냥 = 고양이(scene); 냥.cat.position.set(-1.0, 0, 1.3); 냥.cat.rotation.y = Math.PI / 2;

// 문 위치: 닫힌 동안 천천히 왔다 갔다(띠가 바뀐다) → 넷째 줄에서 오른쪽으로 활짝
const gx = f => 0.6 * Math.sin(f / 20) * (after(4, f) ? 1 - U(4, 0, 0.2, f) : 1) + (after(4, f) ? 9 * U(4, 0.1, 0.55, f) : 0);
const head = () => 냥.머리위치();
const cams = {
  sky: (f, c) => [V(0, 7 - 2 * ease(c), 16 - 3 * ease(c)), V(0, 1.6, 0), 40],
  front: (f, c) => [V(0, 1.7, 8 - 0.8 * ease(c)), V(0, 1.6, 0), 40],
  peek: (f, c) => [V(0.3, 1.2, 1.2 - 0.3 * ease(c)), V(0, 1.3, -2), 52],
  slide: (f, c) => [V(4.2, 1.3, 5), V(0, 1.6, 0), 42],
  rail: (f, c) => { const x = gx(f) + 1; return [V(x + 1.4, 0.3, 1.1), V(x, 0.15, 0), 40]; },
  strip: (f, c) => { const g = gapNear(f); return [V(g, 1.5, 0.55), V(g, 1.5, -2), 22]; },
  cat: (f, c) => { const h = head(); return [h.clone().add(V(0.05, 0.06, -0.85)), h, 32]; },
  close: (f, c) => [V(0, 1.45, 3.0), V(0, 1.4, 0), 42],
  open: (f, c) => [V(0, 1.7, 9.5), V(0, 1.4, -1), 44],
  drone: (f, c) => { const u = ease(c); return [V(7 - 2 * u, 7 - 3 * u, 7), V(0, 1, -2), 45]; },
  tent: (f, c) => [V(-1.6 + 0.6 * ease(c), 0.8, 1.2), V(0, 1.4, TZ), 48],
  trace: (f, c) => [V(0, 1.5, 6.5), V(0, 1.4, -1), 42],
  front2: (f, c) => [V(2.2, 1.6, 5.6), V(0, 1.4, -1.5), 42],
  low2: (f, c) => [V(-3 + 2 * ease(c), 0.35, 7), V(0, 1.2, -1), 44],
  rise: (f, c) => { const u = ease(c); return [V(0, 1 + 70 * u * u, 9 + 24 * u), V(0, 1.4 * (1 - u), -1), 42]; },
};

const mg = 모션(renderer, camera);
// 띠: 문 틈 x 위치(문 좌표) → 그 x 에서 삼각형의 세로 범위
const gaps = []; for (let x = -4 + SL; x < 4; x += SL + GAP) gaps.push(x + GAP / 2);
const gapNear = f => { const x = gx(f); return gaps.reduce((a, g) => Math.abs(g + x) < Math.abs(a) ? g + x : a, 99); };   // 화면 가운데에 가장 가까운 틈
const triY = x => Math.max(0, TH * (1 - Math.abs(x) / TW));
window.draw = f => {
  const x = gx(f); gate.position.x = x; wheels.forEach(w => w.rotation.z = -x / 0.12);
  fire.scale.set(1 + 0.15 * Math.sin(f / 2), 1 + 0.25 * Math.sin(f / 3), 1);
  const sur = after(4, f) ? U(4, 0.45, 0.6, f) * (1 - U(5, 0, 0.3, f)) : 0;
  냥.자세(f, { look: 0.35, yaw: 0.15 * Math.sin(f / 20), surprise: sur });
  노을(after(6, f) ? U(6, 0.3, 1, f) : 0); 숲.움직임(f);
  const [cut, cu] = cutAt(f), [pos, tgt, fov] = cams[cut.cam](f, cu); 찍기(f, pos, tgt, fov);

  mg.begin();
  if (cut.cam === 'peek' && !after(1, f)) mg.label(V(0, 1.3, -0.05), '틈', clamp01(cu * 2.5), 260, -360);
  if (cut.cam === 'slide' || cut.cam === 'rail') mg.arrow2(V(x, 3.6, 0), clamp01(cu * 2), 190);
  if (after(2, f) && !after(3, f)) { mg.big('한 번에 보이는 것: 띠 한 줄', 1520, 76, U(2, 0.1, 0.25, f));
    if (cut.cam === 'strip') { const g = gapNear(f); mg.bracket(V(g - GAP / 2, 2.2, 0.05), V(g + GAP / 2, 2.2, 0.05), '틈 8 cm', clamp01(cu * 2.5)); } }
  if (after(3, f) && !after(4, f)) { const k = U(3, 0.05, 0.6, f); tri.forEach((p, i) => mg.ghost(p, tri[(i + 1) % 3], clamp01(k * 3 - i)));
    mg.big('눈이 아는 것: 삼각형', 1520, 84, U(3, 0.2, 0.35, f), mg.GOLD); }
  if (after(4, f) && !after(5, f)) { mg.pulse(V(0, 1.2, TZ), clamp01((f - T.lines[4][0] - 0.5 * (T.lines[4][1] - T.lines[4][0])) / 30));
    if (cut.cam === 'drone' || cut.cam === 'tent') mg.label(V(0, TH, TZ), '온전한 삼각형', clamp01(cu * 2.2), 230, -330); }
  if (after(5, f) && !after(6, f)) { const k = U(5, 0.05, 0.75, f), n = gaps.length;
    gaps.forEach((g, i) => { const t = clamp01(k * n - i * 0.85); const h = triY(g); if (h > 0.02) mg.line(V(g, 0, TZ + 0.02), V(g, h, TZ + 0.02), t, 12); });
    mg.big('띠 조각 → 삼각형 하나', 1520, 84, U(5, 0.6, 0.75, f), mg.GOLD); }
  if (after(5, f)) mg.tag('Kellman & Shipley, 1991', after(6, f) ? 1 : U(5, 0, 0.15, f));
  if (after(6, f)) mg.border(U(6, 0.45, 0.65, f), f);
  return true;
};
window.ready = true;
</script></body></html>
