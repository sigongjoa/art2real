<!doctype html>
<html><head><meta charset="utf-8"><title>함께 움직임</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// 1-3 함께 움직임(Kellman & Spelke 1983) — 공원 게시판 뒤로 빨간 막대 두 토막이 같이 움직인다 → 하나로 보인다 · 크레인이 게시판을 들면 두 토막.
// 장소: 공원 항공 → 게시판 → 고양이 → 막대 끝 → 크레인 → 틈 → 아기 실험실 → 노을 하늘.
import { THREE, W, H, V, clamp01, ease, rnd, std, mesh, canvasTex, 시간, 무대, 공원, 고양이, 모션 } from './공용.js';
const T = window.__T, { U, after, cutAt } = 시간(T);
const { scene, camera, renderer, 노을, 찍기 } = 무대(), 숲 = 공원(scene), M = (g, m, p, parent) => mesh(scene, g, m, p, parent);

// 게시판(안내도 포스터) · 기둥 · 고리
const board = new THREE.Group(); scene.add(board);
const poster = canvasTex(1024, 600, (x, w, h) => { x.fillStyle = '#f6efe0'; x.fillRect(0, 0, w, h); x.fillStyle = '#3f7d4e'; x.fillRect(0, 0, w, 120);
  x.fillStyle = '#fff'; x.font = 'bold 76px "Malgun Gothic"'; x.textAlign = 'center'; x.fillText('공원 안내도', w / 2, 88);
  x.fillStyle = '#9fd18a'; x.beginPath(); x.ellipse(w / 2, 360, 380, 190, 0, 0, 7); x.fill(); x.fillStyle = '#f4f2ee'; x.beginPath(); x.arc(w / 2, 360, 90, 0, 7); x.fill();
  x.strokeStyle = '#d8c9a9'; x.lineWidth = 28; for (const a of [0.8, 2.4, 3.9, 5.5]) { x.beginPath(); x.moveTo(w / 2 + 90 * Math.cos(a), 360 + 90 * Math.sin(a) * 0.5); x.lineTo(w / 2 + 380 * Math.cos(a), 360 + 190 * Math.sin(a)); x.stroke(); }
  x.fillStyle = '#e8574b'; x.beginPath(); x.arc(w / 2 + 40, 330, 18, 0, 7); x.fill(); x.font = 'bold 40px "Malgun Gothic"'; x.fillStyle = '#333'; x.fillText('현재 위치', w / 2 + 40, 300); });
const woodM = std(0x9a6a43, 0.7);
M(new THREE.BoxGeometry(4.3, 2.5, 0.16), woodM, [0, 2.4, 0], board);
M(new THREE.PlaneGeometry(4.0, 2.25), new THREE.MeshStandardMaterial({ map: poster, roughness: 0.8 }), [0, 2.4, 0.085], board);
M(new THREE.TorusGeometry(0.14, 0.035, 8, 20), std(0x3a3f45, 0.4, 0.8), [0, 3.75, 0], board);
for (const sx of [-1.95, 1.95]) M(new THREE.CylinderGeometry(0.09, 0.1, 3.7, 10), std(0x6f4c33, 0.8), [sx, 1.85, -0.12]);

// 빨간 · 흰 줄무늬 막대 두 토막(게시판 뒤 z=-0.4). 윗 토막 y 3.0–4.6 · 아랫 토막 0.15–1.8 · 사이 1.2 m 는 판이 가린다
const red = std(0xd9423a, 0.45), white = std(0xf5f2ec, 0.5), poles = new THREE.Group(); poles.position.z = -0.4; scene.add(poles);
const piece = (y0, y1) => { for (let y = y0, k = 0; y < y1 - 1e-3; y += 0.2, k++) M(new THREE.CylinderGeometry(0.13, 0.13, Math.min(0.2, y1 - y), 20), k % 2 ? white : red, [0, y + Math.min(0.2, y1 - y) / 2, 0], poles);
  for (const y of [y0, y1]) M(new THREE.SphereGeometry(0.13, 16, 10), red, [0, y, 0], poles).scale.y = 0.35; };
piece(3.0, 4.6); piece(0.15, 1.8);

// 크레인(지온: 상자 몸 · 원기둥 탑 · 상자 팔 · 줄)
const yel = std(0xf2b72e, 0.55), dark = std(0x30343a, 0.6);
M(new THREE.BoxGeometry(2.2, 1.0, 2.4), yel, [9, 0.9, -3]); for (const s of [-1, 1]) M(new THREE.BoxGeometry(2.6, 0.5, 0.5), dark, [9, 0.25, -3 + s * 1.0]);
M(new THREE.BoxGeometry(1.2, 1.0, 1.2), std(0x8fc7e8, 0.2, 0.3), [9.2, 1.9, -2.6]);
M(new THREE.CylinderGeometry(0.28, 0.32, 8.6, 12), yel, [9, 5.6, -3]);
const jib = M(new THREE.BoxGeometry(10.5, 0.45, 0.45), yel, [4.3, 9.9, -1.5]); jib.lookAt(0, 9.9, 0); jib.rotateY(Math.PI / 2);
const cable = M(new THREE.CylinderGeometry(0.025, 0.025, 1, 6).translate(0, -0.5, 0), dark, [0, 9.9, 0]);
const hook = M(new THREE.TorusGeometry(0.16, 0.05, 8, 16, Math.PI * 1.4), dark, [0, 4, 0]);

// 고양이 — 게시판 왼쪽 앞에서 막대를 올려다본다
const 냥 = 고양이(scene); 냥.cat.position.set(-2.0, 0, 1.8); 냥.cat.rotation.y = 0.73;

// 아기 실험실(멀리 x=600): 방 · 창 빛 · 작은 무대(판 + 막대 두 토막) · 아기 의자 · 아기
const LX = 600, lab = new THREE.Group(); lab.position.set(LX, 0, 0); scene.add(lab);
M(new THREE.BoxGeometry(6, 0.1, 6), std(0xe9dcc6, 0.8), [0, -0.05, 0], lab);
M(new THREE.BoxGeometry(6, 3.2, 0.1), std(0xf3e6d6, 0.95), [0, 1.6, -2.2], lab); M(new THREE.BoxGeometry(0.1, 3.2, 6), std(0xe8f0e4, 0.95), [-2.6, 1.6, 0], lab); M(new THREE.BoxGeometry(6, 3.2, 0.1), std(0xf6eadf, 0.95), [0, 1.6, 2.8], lab);
M(new THREE.PlaneGeometry(1.4, 1.0), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.55, 1.4) }), [-2.54, 1.8, 0.4], lab).rotation.y = Math.PI / 2;
const labLight = new THREE.PointLight(0xffe2bf, 6, 8); labLight.position.set(LX - 1.5, 2.6, 1.2); scene.add(labLight);
M(new THREE.BoxGeometry(1.4, 0.7, 0.7), std(0xb9875a, 0.7), [0, 0.35, -0.9], lab);                          // 탁자
const mini = new THREE.Group(); mini.position.set(0, 0.7, -0.9); mini.scale.setScalar(0.16); lab.add(mini);
M(new THREE.BoxGeometry(4.3, 2.5, 0.16), std(0x7fb0d8, 0.6), [0, 2.4, 0], mini);
const miniPoles = new THREE.Group(); miniPoles.position.z = -0.4; mini.add(miniPoles);
for (const [y0, y1] of [[3.0, 4.6], [0.15, 1.8]]) M(new THREE.CylinderGeometry(0.16, 0.16, y1 - y0, 14), red, [0, (y0 + y1) / 2, 0], miniPoles);
const chair = new THREE.Group(); chair.position.set(0, 0, 1.0); lab.add(chair);
for (const [x, z] of [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]]) M(new THREE.CylinderGeometry(0.03, 0.03, 0.7, 8), std(0xffffff, 0.4), [x, 0.35, z], chair);
M(new THREE.BoxGeometry(0.6, 0.06, 0.6), std(0xfafafa, 0.4), [0, 0.72, 0], chair); M(new THREE.BoxGeometry(0.6, 0.6, 0.06), std(0xfafafa, 0.4), [0, 1.0, 0.3], chair);
M(new THREE.BoxGeometry(0.6, 0.05, 0.25), std(0xffc9d6, 0.5), [0, 0.95, -0.25], chair);                     // 식판
const skin = std(0xf6cfb4, 0.7), baby = new THREE.Group(); baby.position.set(0, 0.75, 0.05); chair.add(baby);
M(new THREE.CapsuleGeometry(0.13, 0.12, 6, 12), std(0xa8d8f0, 0.8), [0, 0.18, 0], baby);
const bh = new THREE.Group(); bh.position.set(0, 0.48, 0); baby.add(bh);
M(new THREE.SphereGeometry(0.17, 24, 16), skin, [0, 0, 0], bh);
for (const s of [-1, 1]) { M(new THREE.SphereGeometry(0.035, 12, 8), std(0xffa3a3, 0.8), [0.1 * s, -0.04, -0.13], bh).scale.set(1, 0.7, 0.5);
  M(new THREE.CapsuleGeometry(0.035, 0.12, 4, 8), std(0xa8d8f0, 0.8), [0.17 * s, 0.17, -0.02], baby).rotation.z = 0.5 * s; }
const beyes = [-1, 1].map(s => { const e = M(new THREE.SphereGeometry(0.03, 12, 8), std(0x2a2026, 0.2), [0.06 * s, 0.02, -0.155], bh); M(new THREE.SphereGeometry(0.009, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }), [0.008, 0.012, -0.025], e); return e; });
M(new THREE.TorusGeometry(0.04, 0.012, 6, 12, Math.PI), std(0x8a5a44, 0.8), [0, 0.17, -0.05], bh).rotation.z = Math.PI;   // 머리 한 가닥
M(new THREE.TorusGeometry(0.03, 0.008, 6, 12, Math.PI), std(0xd9776f, 0.6), [0, -0.075, -0.15], bh).rotation.z = Math.PI;  // 입

// 막대 움직임: 같이 좌우로 · 「두 토막」 공개 동안만 멈춤
const amp = f => after(6, f) ? U(6, 0, 0.2, f) : after(5, f) ? 1 - U(5, 0, 0.25, f) : 1;
const px = f => 1.15 * Math.sin(f / 15) * amp(f);

// 카메라
const head = () => 냥.머리위치(), dir = V(0.74, 0, -0.67);
const cams = {
  sky: (f, c) => [V(0, 34 - 8 * ease(c), 26 - 6 * ease(c)), V(0, 2, 0), 40],
  front: (f, c) => [V(0, 2.6, 9.5 - ease(c)), V(0, 2.6, 0), 42],
  cat: (f, c) => [V(-3.1, 0.95, 3.6), V(-1.1, 1.5, 0.8), 50],
  ends: (f, c) => { const x = px(f); return [V(x + 0.9, 4.3, 2.6), V(x, 4.0, -0.4), 38]; },
  cat2: (f, c) => { const h = head(); return [h.clone().addScaledVector(dir, 0.85).add(V(0, 0.08, 0)), h, 32]; },
  move: (f, c) => [V(0, 2.6, 7 - 1.2 * ease(c)), V(0, 2.6, 0), 40],
  close: (f, c) => { const x = px(f); return [V(x + 0.9, 0.6, 2.4), V(x, 1.0, -0.4), 38]; },
  ghost: (f, c) => [V(0, 2.5, 7.2), V(0, 2.5, 0), 42],
  side: (f, c) => [V(5.5, 2.6, 5.5 - 0.6 * ease(c)), V(0, 2.5, -0.3), 40],
  crane: (f, c) => [V(10, 2, 12), V(3, 4, -1), 58],
  lift: (f, c) => { const y = 4.6 * U(4, 0.3, 0.95, f); return [V(0, 3.5 + 0.5 * y, 11), V(0, 3.2 + 0.5 * y, 0), 50]; },
  gap: (f, c) => [V(0.9, 2.4, 3.6), V(0, 2.4, -0.4), 45],
  wide: (f, c) => [V(0, 3.2, 12), V(0, 3.4, 0), 46],
  arrows: (f, c) => [V(0, 2.5, 8.5), V(0, 2.5, 0), 44],
  lab: (f, c) => [V(LX + 4.6 - 0.4 * ease(c), 1.7, 0.1), V(LX, 0.9, 0.15), 58],
  baby: (f, c) => [V(LX + 0.15, 1.3, 0.05 + 0.1 * ease(c)), V(LX, 1.23, 1.05), 40],
  rise: (f, c) => { const u = ease(c); return [V(0, 0.8 + 70 * u * u, 10 + 24 * u), V(0, 3 * (1 - u), 0), 42]; },
};

const mg = 모션(renderer, camera);
window.draw = f => {
  const x = px(f), lift = after(4, f) ? 4.6 * U(4, 0.3, 0.95, f) : 0;
  poles.position.x = x; board.position.y = lift;
  cable.scale.y = 9.9 - (3.75 + lift) - 0.12; hook.position.y = 3.75 + lift + 0.1;
  miniPoles.position.x = 1.1 * Math.sin(f / 15);
  // 고양이: 막대 끝을 고개로 따라간다 · 두 토막에 놀람
  const sur = after(5, f) ? U(5, 0.05, 0.2, f) * (1 - U(6, 0.3, 0.6, f)) : 0;
  냥.자세(f, { look: 0.75, yaw: -0.25 * Math.sin(f / 15) * amp(f), surprise: sur });
  // 아기: 눈과 머리가 막대를 따라간다
  bh.rotation.y = -0.1 * Math.sin(f / 15); beyes.forEach(e => e.position.x = Math.sign(e.position.x) * 0.06 + 0.012 * Math.sin(f / 15));
  노을(after(8, f) ? U(8, 0.2, 1, f) : 0); 숲.움직임(f);
  const [cut, cu] = cutAt(f), [pos, tgt, fov] = cams[cut.cam](f, cu); 찍기(f, pos, tgt, fov);

  // 모션 그래픽
  mg.begin(); const top = V(x, 4.6, -0.4), bot = V(x, 0.15, -0.4);
  if (cut.cam === 'cat') mg.big('막대  ?개', 1520, 96, clamp01(cu * 3));
  if (cut.cam === 'ends') { if (!after(6, f)) mg.label(top.clone().add(V(0, 0.1, 0)), '위로 한 끝', clamp01(cu * 2.2), -260, -300); else mg.label(V(x, 3.8, -0.4), '윗 토막', clamp01(cu * 2.2), -260, -360); }
  if (cut.cam === 'cat2') mg.label(bot.clone().add(V(0, 1.2, 0)), '아래로 한 끝', clamp01(cu * 2.2), 0, 420);
  if (cut.cam === 'move') { mg.arrow2(V(x, 4.3, -0.4), clamp01(cu * 2)); mg.arrow2(V(x, 0.7, -0.4), clamp01(cu * 2)); }
  if (cut.cam === 'close') mg.arrow2(V(x, 1.0, -0.4), clamp01(cu * 2));
  if (after(3, f) && !after(4, f)) { mg.ghost(V(x, 3.0, -0.4), V(x, 1.8, -0.4), U(3, 0.05, 0.5, f)); mg.big('보이는 막대  1개', 1520, 96, U(3, 0.15, 0.3, f));
    if (cut.cam === 'ghost') mg.label(V(x, 2.4, -0.4), '뇌가 이은 부분', U(3, 0.25, 0.6, f), 300, 380); }
  if (after(5, f) && !after(6, f)) { mg.bracket(V(x, 3.0, -0.4), V(x, 1.8, -0.4), '빈 틈', U(5, 0.15, 0.4, f)); mg.big('실제 막대  2개', 1520, 96, U(5, 0.1, 0.3, f), mg.GOLD);
    mg.pulse(V(x, 2.4, -0.4), clamp01((f - T.lines[5][0]) / 30)); }
  if (after(6, f) && !after(7, f)) { mg.big('같은 방향 · 같은 속도', 1520, 84, U(6, 0.05, 0.2, f), mg.GOLD);
    if (cut.cam !== 'ends') { mg.arrow2(V(x, 4.2, -0.4), U(6, 0.1, 0.3, f)); mg.arrow2(V(x, 0.9, -0.4), U(6, 0.1, 0.3, f)); }
    if (cut.cam === 'side') mg.label(V(x, 1.0, -0.4), '아랫 토막', clamp01(cu * 2.2), 260, 380); }
  if (after(7, f) && !after(8, f)) { const hp = new THREE.Vector3(); bh.getWorldPosition(hp);
    mg.label(hp.clone().add(V(0, 0.2, 0)), '생후 4개월', clamp01(cutAt(f)[1] * 2.2), -240, -380); mg.tag('Kellman & Spelke, 1983', U(7, 0, 0.15, f)); }
  if (after(8, f)) { mg.border(U(8, 0.35, 0.55, f), f); mg.tag('Kellman & Spelke, 1983', 1); }
  return true;
};
window.ready = true;
</script></body></html>
