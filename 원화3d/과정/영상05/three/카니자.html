<!doctype html>
<html><head><meta charset="utf-8"><title>카니자 three</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
// 1-2 카니자 — 블렌더 장면.py 와 같은 줄거리 · 같은 시간표, 장난감 디테일만 더한다(툰 재질 · 외곽선 · 풀 · 꽃 · 구름 · 고양이 표정 · 먼지 · 반짝이).
// 좌표: 블렌더 (x, y깊이, z위) → three (x, z위, -y).  window.draw(f) 가 프레임 f(1부터)를 그린다.
import * as THREE from 'three';
const W = 1080, H = 1920;
const T = window.__T;                       // three굽기.py 가 시간표를 넣어 준다
const ease = u => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(Math.max(u, 0), 1));
const U = (i, a, b, f) => { const [f0, f1] = T.lines[i], L = f1 - f0; return ease((f - f0 - a * L) / Math.max(1, (b - a) * L)); };
const after = (i, f) => f >= T.lines[i][0];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xcfe3f5, 14, 34);

// 툰 재질 · 외곽선
const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
const inkM = new THREE.MeshBasicMaterial({ color: 0x2a2030, side: THREE.BackSide });
function mesh(g, m, p = [0, 0, 0], parent = scene, ink = 0.018) {
  const o = new THREE.Mesh(g, m); o.position.set(...p); o.castShadow = o.receiveShadow = true; parent.add(o);
  if (ink) { g.computeBoundingSphere(); const s = new THREE.Mesh(g, inkM); s.scale.setScalar(1 + ink / Math.max(0.02, g.boundingSphere.radius)); o.add(s); }
  return o;
}

// 하늘 · 빛
const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'varying vec3 p; void main(){ float h = clamp(normalize(p).y*1.6+0.25,0.,1.); gl_FragColor = vec4(mix(vec3(1.0,0.82,0.78), vec3(0.45,0.70,0.98), h), 1.); }' }));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x7fb069, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(4, 8, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.radius = 4;
scene.add(sun);

// 땅 · 풀 · 꽃 · 돌 · 나무 · 구름
mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), toon(0x8fcf7a), [0, 0, 0], scene, 0);
const tuft = new THREE.ConeGeometry(0.035, 0.16, 4), tuftM = toon(0x5fae55);
const grass = new THREE.InstancedMesh(tuft, tuftM, 900); const d = new THREE.Object3D();
for (let i = 0; i < 900; i++) {
  const r = 1.2 + rnd() * 9, a = rnd() * Math.PI * 2; d.position.set(r * Math.cos(a), 0.07, r * Math.sin(a) - 1);
  d.rotation.set((rnd() - .5) * .5, rnd() * 3, (rnd() - .5) * .5); d.scale.setScalar(0.45 + rnd() * 0.6); d.updateMatrix(); grass.setMatrixAt(i, d.matrix);
}
grass.receiveShadow = true; scene.add(grass);
const petals = [0xff8fb1, 0xffd35c, 0xffffff, 0xb08cff];
for (let i = 0; i < 70; i++) {
  const r = 1.4 + rnd() * 6, a = rnd() * Math.PI * 2, x = r * Math.cos(a), z = r * Math.sin(a) - 1, f = new THREE.Group();
  f.position.set(x, 0, z); scene.add(f);
  mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.18), toon(0x4c9a4a), [0, 0.09, 0], f, 0);
  mesh(new THREE.SphereGeometry(0.045, 8, 6), toon(petals[i % 4]), [0, 0.19, 0], f, 0.006).scale.y = 0.6;
  mesh(new THREE.SphereGeometry(0.018, 6, 4), toon(0xffb000), [0, 0.215, 0], f, 0);
}
for (let i = 0; i < 9; i++) { const a = rnd() * 6.28, r = 2 + rnd() * 5;
  mesh(new THREE.DodecahedronGeometry(0.08 + rnd() * 0.12), toon(0xb9b3ad), [r * Math.cos(a), 0.04, r * Math.sin(a) - 1], scene, 0.01); }
function tree(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  mesh(new THREE.CylinderGeometry(0.09, 0.13, 1.0, 7), toon(0x9a6a43), [0, 0.5, 0], g, 0.012);
  const greens = [0x4fa85a, 0x63bd63, 0x3f9450];
  for (let k = 0; k < 3; k++) mesh(new THREE.IcosahedronGeometry(0.55 - k * 0.12, 1), toon(greens[k]), [(rnd() - .5) * .3, 1.15 + k * 0.42, (rnd() - .5) * .3], g, 0.015);
}
for (let i = 0; i < 16; i++) { const a = Math.PI * (0.15 + 0.7 * rnd()), r = 5 + rnd() * 6; tree(r * Math.cos(a) * 1.4, -r * Math.sin(a) - 0.5, 0.8 + rnd() * 0.7); }
for (const [x, z] of [[-3.2, 1.5], [-4.5, -2], [4.8, -2.5]]) tree(x, z, 0.9);   // 오른쪽 앞은 비운다 — orbit 카메라 길
const cloudM = toon(0xffffff);
for (let i = 0; i < 6; i++) { const c = new THREE.Group(); c.position.set(-14 + i * 5.5, 7 + rnd() * 3, -22 - rnd() * 6); scene.add(c);
  for (let k = 0; k < 5; k++) mesh(new THREE.SphereGeometry(0.9 + rnd() * 0.8, 12, 8), cloudM, [k * 1.1 - 2.2, (rnd() - .3) * .6, rnd() * .5], c, 0); }

// 흰 판(이젤) — 앞면은 빛 영향 없는 고른 흰색: 착시는 바탕이 고와야 선다
const board = new THREE.Group(); board.position.set(0, 1.7, -1.2); scene.add(board);
mesh(new THREE.BoxGeometry(3.75, 3.55, 0.08), toon(0xd9b98c), [0, 0, -0.05], board, 0.01);
const face = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.4), new THREE.MeshBasicMaterial({ color: 0xffffff })); face.position.z = 0.0; board.add(face);
for (const sx of [-1.4, 1.4]) mesh(new THREE.BoxGeometry(0.1, 1.9, 0.1), toon(0xb48a5c), [sx, -1.75, -0.12], board, 0.01);

// 이 빠진 원반 셋 — 꼭짓점마다 60° 홈이 가운데를 본다
const C = new THREE.Vector2(0, 1.25), R = 0.85, r = 0.3, verts = [];
const black = new THREE.MeshStandardMaterial({ color: 0x0b0b10, roughness: 0.35, metalness: 0.1 });
for (const a of [90, 210, 330]) {
  const v = new THREE.Vector2(Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180)).multiplyScalar(R).add(C); verts.push(v);
  const toC = Math.atan2(C.y - v.y, C.x - v.x), sh = new THREE.Shape();
  sh.moveTo(0, 0); sh.absarc(0, 0, r, toC + Math.PI / 6, toC + Math.PI / 6 + Math.PI * 5 / 3, false); sh.lineTo(0, 0);
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 3, curveSegments: 48 });
  mesh(g, black, [v.x, v.y, -0.025], scene, 0);
}
// 뇌가 이은 모서리 — 그려지듯 자라는 빛 막대
const glowM = new THREE.MeshBasicMaterial({ color: 0xffd23a, transparent: true, opacity: 0 });
const edges = verts.map((p, i) => { const q = verts[(i + 1) % 3], len = p.distanceTo(q);
  const o = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 1, 10).translate(0, 0.5, 0), glowM);
  o.position.set(p.x, p.y, 0.05); o.rotation.z = Math.atan2(q.y - p.y, q.x - p.x) - Math.PI / 2; o.userData.len = len; scene.add(o); return o; });
const sparkM = new THREE.MeshBasicMaterial({ color: 0xfff6c0, transparent: true });
const sparks = Array.from({ length: 14 }, () => { const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.035), sparkM); s.userData = { e: Math.floor(rnd() * 3), t: rnd(), ph: rnd() * 6 }; scene.add(s); return s; });

// 고양이 — 툰 · 외곽선 · 줄무늬 · 눈 하이라이트 · 수염 · 줄무늬 꼬리 (+x 를 본다, 발바닥이 원점)
const fur = toon(0xf29a45), furD = toon(0xc8692a), cream = toon(0xfff1dc), pink = toon(0xff9aa8);
const cat = new THREE.Group(); scene.add(cat);
const body = mesh(new THREE.CapsuleGeometry(0.13, 0.26, 6, 14).rotateZ(Math.PI / 2), fur, [0, 0.3, 0], cat);
mesh(new THREE.SphereGeometry(0.1, 12, 8), cream, [0.06, 0.25, 0], cat, 0).scale.set(1.6, 0.8, 1.05);
for (const x of [-0.12, -0.03, 0.06]) mesh(new THREE.TorusGeometry(0.133, 0.014, 6, 18, Math.PI * 0.9).rotateY(Math.PI / 2).rotateX(Math.PI * 0.05), furD, [x, 0.3, 0], cat, 0);
const head = new THREE.Group(); head.position.set(0.25, 0.44, 0); cat.add(head);
mesh(new THREE.SphereGeometry(0.135, 20, 14), fur, [0, 0, 0], head).scale.set(1, 0.9, 1.08);
mesh(new THREE.SphereGeometry(0.07, 14, 10), cream, [0.09, -0.045, 0], head, 0).scale.set(0.8, 0.7, 1.2);
const ears = [-1, 1].map(s => { const e = new THREE.Group(); e.position.set(-0.01, 0.1, 0.075 * s); head.add(e);
  mesh(new THREE.ConeGeometry(0.055, 0.11, 4).rotateY(Math.PI / 4), fur, [0, 0.04, 0], e);
  mesh(new THREE.ConeGeometry(0.03, 0.07, 4).rotateY(Math.PI / 4), pink, [0.018, 0.035, 0], e, 0); return e; });
const eyes = [-1, 1].map(s => { const e = new THREE.Group(); e.position.set(0.105, 0.025, 0.052 * s); head.add(e);
  mesh(new THREE.SphereGeometry(0.036, 14, 10), toon(0xffffff), [0, 0, 0], e, 0.004);
  const pu = mesh(new THREE.SphereGeometry(0.024, 12, 8), new THREE.MeshBasicMaterial({ color: 0x1b1420 }), [0.018, 0, 0], e, 0); pu.scale.set(0.6, 1.15, 1);
  mesh(new THREE.SphereGeometry(0.008, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }), [0.036, 0.012, 0.008 * s], e, 0);
  e.userData.pu = pu; return e; });
mesh(new THREE.SphereGeometry(0.016, 8, 6), pink, [0.15, -0.025, 0], head, 0).scale.set(0.7, 0.7, 1.2);
const whM = new THREE.LineBasicMaterial({ color: 0x3a2a30 });
for (const s of [-1, 1]) for (const k of [-1, 0, 1]) head.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0.13, -0.04, 0.04 * s), new THREE.Vector3(0.17, -0.04 + 0.018 * k, 0.16 * s)]), whM));
const legs = [[0.17, 0.08], [0.17, -0.08], [-0.15, 0.08], [-0.15, -0.08]].map(([x, z]) => { const g = new THREE.Group(); g.position.set(x, 0.24, z); cat.add(g);
  mesh(new THREE.CapsuleGeometry(0.038, 0.13, 4, 8), fur, [0, -0.11, 0], g);
  mesh(new THREE.SphereGeometry(0.045, 10, 8), cream, [0.01, -0.21, 0], g, 0.006).scale.set(1.2, 0.65, 1); return g; });
const tail = []; let par = cat, tp = [-0.27, 0.36, 0];
for (let k = 0; k < 7; k++) { const g = new THREE.Group(); g.position.set(...tp); par.add(g);
  mesh(new THREE.SphereGeometry(0.042 - k * 0.002, 10, 8), k % 2 ? furD : fur, [0, 0.03, 0], g, 0.006).scale.y = 1.4;
  tail.push(g); par = g; tp = [0, 0.065, 0]; }
// 놀람 「!」
const bang = new THREE.Sprite(new THREE.SpriteMaterial({ map: (() => { const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); x.font = 'bold 110px sans-serif'; x.textAlign = 'center'; x.lineWidth = 12; x.strokeStyle = '#2a2030'; x.fillStyle = '#ffdd33';
  x.strokeText('!', 64, 105); x.fillText('!', 64, 105); return new THREE.CanvasTexture(c); })(), transparent: true }));
bang.scale.setScalar(0.32); scene.add(bang);
// 먼지
const dustM = new THREE.MeshToonMaterial({ color: 0xf5efe6, gradientMap: grad, transparent: true });
const dust = Array.from({ length: 10 }, (_, i) => { const p = mesh(new THREE.SphereGeometry(0.06, 8, 6), dustM, [0, 0, 0], scene, 0); p.userData.a = i / 10 * Math.PI * 2; return p; });

// 카메라(블렌더 렌즈 → 세로 화각) · 컷마다 살짝 밀고 들어간다
const fov = lens => 2 * Math.atan(18 / lens) * 180 / Math.PI;
const B = (x, y, z) => new THREE.Vector3(x, z, -y);
const cams = { front: [B(0, -4.2, 1.2), B(0, 0, 1.15), 35], close: [B(0, -3.0, 1.2), B(0, 0, 1.15), 30], low: [B(1.3, -2.2, 0.25), B(-0.4, 0, 0.7), 26],
  catcam: [B(-1.7, -1.2, 0.55), B(0, 0, 0.9), 26], fall: [B(0.8, -1.9, 0.45), B(0, -0.1, 0.5), 26], orbit: [B(0, -4.2, 1.2), B(0, 0.1, 1.15), 30] };
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 120);
const cutAt = f => { let s = 1; for (const c of T.cuts) { if (f < s + c.n) return [c, (f - s) / c.n]; s += c.n; } return [T.cuts.at(-1), 1]; };

const baseY = C.y - R / 2;
window.draw = f => {
  // 고양이 움직임 — 블렌더 장면.py 와 같은 곡선
  let x = -2.6, y = 0, spin = 0, walk = false, surprise = 0;
  if (after(1, f)) { const u = U(1, 0, 0.75, f); x = -2.6 + (2.6 - 0.55) * u; walk = u > 0 && u < 1; }
  if (after(2, f)) { const cr = U(2, 0, 0.3, f) * (1 - U(2, 0.3, 0.4, f)), j = U(2, 0.35, 0.95, f);
    x = -0.55 + 0.55 * j; y = -0.05 * cr + baseY * j + 0.35 * Math.sin(Math.PI * j); cat.scale.set(1 + 0.12 * cr, 1 - 0.15 * cr, 1); }
  if (after(3, f)) { const dd = U(3, 0.2, 0.45, f); x = 0; y = baseY * (1 - dd * dd); spin = 1.6 * dd * (1 - U(3, 0.6, 0.8, f));
    y += 0.08 * Math.sin(Math.PI * U(3, 0.45, 0.6, f)); surprise = U(3, 0.05, 0.2, f) * (1 - U(4, 0.3, 0.5, f));
    const land = U(3, 0.45, 0.5, f); cat.scale.set(1 + 0.2 * land * (1 - U(3, 0.5, 0.6, f)), 1 - 0.22 * land * (1 - U(3, 0.5, 0.6, f)), 1); }
  cat.position.set(x, Math.max(y, 0), 0.1); cat.rotation.x = spin;
  const look = after(1, f) ? U(1, 0.75, 0.95, f) * (1 - U(2, 0.3, 0.4, f)) : 0;
  head.rotation.set(0, after(4, f) ? 0.55 * Math.sin(f / 9) * U(4, 0, 0.2, f) : 0, 0.6 * look + 0.2 * surprise);
  for (const [i, g] of legs.entries()) g.rotation.z = walk ? 0.55 * Math.sin(f / 3 + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI : 0)) : 0;
  for (const [k, g] of tail.entries()) { g.rotation.z = -0.35 + 0.18 * Math.sin(f / 7 - k * 0.6) - 0.4 * surprise; g.rotation.x = 0.12 * Math.sin(f / 11 - k * 0.5); }
  for (const e of ears) e.rotation.x = 0.04 * Math.sin(f / 13) - 0.25 * surprise * Math.sign(e.position.z);
  const blink = (f % 70) < 3 && !surprise ? 0.15 : 1;
  for (const e of eyes) { e.scale.set(1, (1 + 0.35 * surprise) * blink, 1 + 0.2 * surprise); e.userData.pu.scale.setScalar(1 - 0.45 * surprise); }
  bang.position.set(x + 0.25, Math.max(y, 0) + 0.85 + 0.05 * Math.sin(f / 3), 0.1); bang.material.opacity = surprise;
  bang.scale.setScalar(0.32 * (0.6 + 0.4 * Math.min(1, surprise * 1.4)));
  // 먼지 — 착지 순간 퍼진다
  const pu = after(3, f) ? U(3, 0.45, 0.8, f) : 0;
  for (const p of dust) { p.position.set(x + Math.cos(p.userData.a) * (0.15 + 0.5 * pu), 0.05 + 0.15 * pu, 0.1 + Math.sin(p.userData.a) * (0.12 + 0.35 * pu));
    p.scale.setScalar(pu > 0 && pu < 1 ? 1 + 1.5 * pu : 0.001); dustM.opacity = 1 - pu; }
  // 빛 모서리 — 하나씩 그려진다 · 반짝이
  const gu = after(5, f) ? U(5, 0.05, 0.6, f) : 0; glowM.opacity = gu > 0 ? 0.95 : 0;
  edges.forEach((e, i) => e.scale.set(1, Math.max(0.001, e.userData.len * Math.min(1, Math.max(0, gu * 3 - i))), 1));
  for (const s of sparks) { const e = edges[s.userData.e], p = verts[s.userData.e], q = verts[(s.userData.e + 1) % 3], t = s.userData.t;
    s.position.set(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t + 0.09, 0.12); const tw = 0.5 + 0.5 * Math.sin(f / 4 + s.userData.ph);
    s.visible = gu >= 1 / 3 * (s.userData.e + 1) * 0.999; s.scale.setScalar(0.3 + 0.8 * tw); s.rotation.y = f / 10 + s.userData.ph; sparkM.opacity = 0.9; }
  // 카메라
  const [cut, cu] = cutAt(f); let [pos, tgt, lens] = cams[cut.cam]; pos = pos.clone(); tgt = tgt.clone();
  if (cut.cam === 'orbit') { const u = after(4, f) ? U(4, 0, 0.7, f) : 0, a = (-90 + 72 * u) * Math.PI / 180, dist = 4.2 - 0.6 * u;
    pos = B(dist * Math.cos(a), dist * Math.sin(a), 1.2 + 0.3 * u); }
  else pos.lerp(tgt, 0.07 * ease(cu));
  pos.y += 0.012 * Math.sin(f / 17); camera.position.copy(pos); camera.fov = fov(lens); camera.updateProjectionMatrix(); camera.lookAt(tgt);
  renderer.render(scene, camera);
  return true;
};
window.N = T.lines.at(-1)[1]; window.ready = true;
</script></body></html>
