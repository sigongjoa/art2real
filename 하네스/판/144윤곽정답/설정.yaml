  시도: 둥근 면의 윤곽선까지 정답에 넣고 다시 잰다
  명제: 143 과 같은 입력 · 벡터화를, CAD 모서리에 곡면 테 윤곽선을 더한 정답으로 재면 윤곽선의 80 % 이상을 찾고 찾은 윤곽선의 종류(눈
