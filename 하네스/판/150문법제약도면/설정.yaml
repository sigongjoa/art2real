  시도: 코드를 쓰는 중에 문법상 안 되는 다음 토큰을 막아 실행되는 코드만 나오게 한다
  명제: 146(도면 → ViT)이 학습한 LoRA 를 그대로 두고 생성만 CadQuery 부분 문법 제약(괄호 짝 · 정의된 bN 만 · 학습
    정답에 나온 cq 경로 2 개 · 메서드 16 개 · .add( 뒤는 cq.Solid.makeCone( 만 · 괄호가 열린 채 줄을 끝내려
    하면 닫고 줄 바꿈)으로 바꾸면, 시험 299 개 실행률이 0.95 이상이 되고 실행된 것만의 IoU 중앙값은 0.50 이상으로 유지된다(146
    은 0.890 · 0.518)
  물음: 남은 실행 실패는 디코딩 단계에서 막을 수 있는 문법 실수인가
