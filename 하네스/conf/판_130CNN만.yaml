# 판 130 — CNN 백본만 학습해서 도면의 선 종류 · 꼭짓점을 화소마다 찾나 · 정답은 CAD 형상 투영(하네스/선정답.py) · 10-22
defaults: [바탕, _self_]
판:
  이름: 130CNN만
  가지: A3
  시도: CNN 만 학습해서 도면의 곡선과 꼭짓점을 찾는지 본다
  명제: 127 과 같은 CNN 을 선 정답으로 10 에폭 학습하면 곡선 · 직선 화소를 0.80 넘게 맞히고 꼭짓점 F1 이 0.60 을 넘으며, 같은 머리에 화소를 그대로 넣은 대조보다 곡선 · 꼭짓점이 0.10 넘게 낫다
  물음: CNN 은 곡선과 꼭짓점을 잡을 수 있나(손실이 시키면)
  종류: 비교
목표: 선지도
점검: [연기, 곡선]
기준:   # 돌리기 전에 적음 · 대조는 같은 판 안에서 같은 에폭 · 같은 머리로 학습한 화소 그대로(점검이 *_화소 · *_차 를 만듦)
  - {지표: 선_곡선, 식: ">=", 값: 0.80}
  - {지표: 선_직선, 식: ">=", 값: 0.80}
  - {지표: 점_F1, 식: ">=", 값: 0.60}
  - {지표: 선_곡선_차, 식: ">=", 값: 0.10}
  - {지표: 점_F1_차, 식: ">=", 값: 0.10}
대조:
  판: 같은 판 화소 그대로(같은 머리 · 같은 10 에폭)
  에폭: 10
  값: {}
