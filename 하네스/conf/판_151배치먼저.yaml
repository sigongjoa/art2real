# 판 151 — 147 과 같고 정답 코드 서식만: 첫 줄 layout = [(종류, 축, 자리), …] 로 몸 개수 · 배치를 먼저 쓰고 몸 줄은 at(i, 모양식)(코드글.배치먼저 · 같은 입체 왕복 확인 · 답 413 → 432 토큰)
# 근거(10-25 원인 쪼개기 · 스크립트): 147 실행된 253 개 중 몸 개수 맞음 39 % · 개수 같은 99 개에서 위치만 정답으로 바꾸면 IoU 0.54 → 0.70 · 모양식만 바꾸면 0.55 · 생성 코드는 몸을 거의 늘 위아래로 쌓음
# 생각: 지금 서식은 모양식을 다 쓰고 나서 위치를 정함(앞에서부터 한 토큰씩) → 배치를 먼저 정하게 하면 개수 · 자리가 모양식에 끌려가지 않는다 · 사용자 10-25 「학습으로 더 맞추는 게 안정적 · 2 번이 좋아 보인다」
