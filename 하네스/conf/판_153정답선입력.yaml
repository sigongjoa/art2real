# 판 153 — 152(시드 0)가 학습한 LoRA 를 그대로 · 입력 선 글만 CNN 예측 대신 정답 선지도(선정답 · CAD 형상 투영)를 같은 벡터화로 · 학습 없음 · 탐욕이라 결정적(시드 반복 안 함)
# 10-27 사용자 「2D 로 뽑는 것 자체는 잘된다는 건 확인 · 뽑힌다는 게 위치가 잘 맞는다는 건 아닐 수 있다」 — 152 원인 쪼개기: 위치만 정답으로 바꾸면 0.53 → 0.71 · 그 위치 오차가 CNN 선에서 왔나 언어 모델에서 왔나
# 읽는 법: 크게 오르면 CNN · 벡터화 위치가 병목 · 그대로면 언어 모델 쪽(LoRA 손잡이로) · LoRA 는 CNN 선으로만 배워 정답 선이 낯설 수 있음 → 안 오르면 그 몫을 감안
