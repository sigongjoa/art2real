# 판 142 — 학습 · 모델 없음 · CAD 정답 형상으로: 한 뷰에서 같은 2D 선에 포개진 3D 모서리(층)를 나머지 두 뷰가 가르나(천장) · 10-24 사용자 「겹치면 2d 라 층별로 쌓인 건지 둥근 테두리인지 모르잖아」
defaults: [바탕, _self_]
판:
  이름: 142세뷰
  가지: A4
  시도: 한 장에서 포개진 선을 나머지 두 장으로 가른다
  명제: 시험 부품 299 개의 CAD 모서리를 위 · 앞 · 옆에 투영하면 그려진 2D 선의 일부는 깊이가 다른 3D 모서리 둘 이상이 포갠 것이고, 그런 포갠 선의 90 % 이상은 무리 안 모든 모서리 짝이 다른 두 뷰 가운데 하나에서 갈라진다. 그래서 겹침은 한 장에서 풀지 않고 세 뷰 짝 맞추기 단계로 넘겨도 된다. 투영에 실패한 부품은 15 개 이하
  물음: 한 장에서 포개진 모서리를 다른 두 장이 가를 수 있나
