# 하네스 바탕 설정 = 모델127(Gemma 빼고 3면도 CNN 조각 토큰 → 트랜스포머 디코더 칸 6 · 부피 순 짝) · 10-22
# 판 설정은 이 파일을 defaults 로 받고 「손잡이」 하나만 바꾼다(관문이 센다). 판 · 기준 · 대조 · 점검 칸은 손잡이로 안 셈.
판:
  이름: ???
  가지: ???          # claudedocs/문제트리.md 의 가지 번호(A3 등)
  시도: ???          # 이 판에서 해 보는 일 한 문장(괄호 · 숫자 문턱 없이 · 60 자 안) · 보고서 맨 위 · 판 목록 · 이슈 제목
  명제: ???          # 판별 문장(사전 예측 · 기준과 맞물림) · 판정 기준 표 위에 작게
  물음: ???
  종류: 비교         # 비교(손잡이 하나) · 탐색(여럿 · 「이김」 판정 못 냄) · 재현(손잡이 0)
데이터:
  그림: 128
  학습수: 12000      # 12000 번 미만 = 학습 · 이상 = 시험(얼린 299)
인코더: cnn          # cnn(모델127) | cnn4(모델129c · 실선/숨은선 · 좌표 · 첫 보폭 1)
짝: 부피순           # 부피순(127) | 헝가리안(129a)
학습:
  에폭: 10
  배치: 128
  미세: 128          # 기울기 누적 조각(보폭 1 판은 32)
  학습률: 3.0e-4
  감쇠: 1.0e-4
점검: [연기, 곡선, 층보기, 탐침]   # 평가(IoU · 렌더 600 · 15 분)는 넣을 때만
끝: [쇼츠, 커밋, 공개, 이슈]   # 판 끝에 자동: 쇼츠(대본 · 검사 · 굽기 · 업로드 대기) · 커밋 · 공개 푸시(걸러서) · GitHub 이슈
기준: []             # [{지표: 이름, 식: ">=", 값: 0.0}] · 비면 관문이 막음
대조: {}             # {판: 이름, 에폭: n, 값: {지표: 숫자}} · 에폭이 학습.에폭 과 다르면 관문이 막음
hydra:
  run: {dir: "G:/art2real/out/하네스/_hydra/${now:%m%d_%H%M%S}"}
  job: {chdir: false}
선지도: {빈가중: 0.05}   # 선지도 과제만: 선 없는 화소의 손실 가중(130 = 0.05)
목표: CAD           # CAD(덩어리 숫자 · 디코더) | 선지도(CNN 만 · 화소마다 선 종류 · 숨은선 · 꼭짓점 · 정답 하네스/선정답.py · 학습 3000 · 시험 299)
