# 판 139 — 137 에서 종류를 화소마다 하나만 고르던 것을 종류마다 따로 예/아니오로(다중 라벨)만 · 137: 곡선 옆 직선 0.24 · 겹침 진단 직선-곡선이 붙은 화소에서 틀림이 몰림 · 10-23
defaults: [바탕, _self_]
판:
  이름: 139다중라벨
  가지: A3
  시도: 직선과 곡선이 닿은 화소는 둘 다 정답으로 둔다
  명제: 137 과 같은 설정 · 60 바퀴에서 종류를 화소마다 하나만 고르게 하지 않고 종류마다 따로 묻고 닿은 화소는 둘 다 정답으로 두면, 곡선 옆 직선을 곡선으로 읽는 비율이 0.24 에서 0.15 아래로 내려가고 곡선 · 직선 0.80 을 넘으며 선 자리 0.95 를 지킨다. 목표선(곡선 · 직선 0.90 · 꼭짓점 0.75)도 같이 잰다
  물음: 곡선 옆 직선의 번짐은 닿은 화소에 종류 하나만 고르라고 해서인가
  종류: 비교
목표: 선지도
선지도: {빈가중: 0.3, 맞춤: true, 탐침층: true, 합침: 전부, 테: 구분, 다중: true}
학습: {학습률: 3.0e-3, 에폭: 60, 미세: 32}   # 미세는 손잡이 아님
점검: [연기, 곡선]
기준:   # 앞 넷 = 이 판 예측 · 뒤 셋 = 목표선 · 돌리기 전에 커밋
  - {지표: 선_곡선옆직선오류, 식: "<=", 값: 0.15}
  - {지표: 선_곡선, 식: ">=", 값: 0.80}
  - {지표: 선_직선, 식: ">=", 값: 0.80}
  - {지표: 선_자리, 식: ">=", 값: 0.95}
  - {지표: 선_곡선, 식: ">=", 값: 0.90}
  - {지표: 선_직선, 식: ">=", 값: 0.90}
  - {지표: 점_F1, 식: ">=", 값: 0.75}
