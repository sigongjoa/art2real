# 비교판 「선판정」 — 직선 · 곡선이 붙은 모서리를 어느 방법이 덜 틀리나 · 10-23 · 결과 페이지 꼴 B(겹침 지도형 · 사용자)
비교:
  이름: 선판정
  물음: 직선과 곡선이 붙어 지나는 모서리를 어느 방법이 덜 틀리나
  공통자:
    주지표: 모서리_종류_직곡     # 직선-곡선 붙은 모서리의 종류 맞힘(하네스/공통자.py)
    보조: [모서리_종류, 모서리_찾음]
  시험: 선정답 시험 299 · 정답 모서리 out/하네스/겹침
  시드: 3                      # 같은 설정 반복 → 흔들림 폭(시드 1 개뿐이면 이김 판정 보류)
  예산: {에폭: 60}
  결정:
    문턱: 0.05                 # 1 위가 2 위보다 주지표 +0.05 이상 · 시드 폭이 안 겹치면 이김
참가자:
  - {판: 137전부합침, 이름: 판 137 · 화소(네 층 합침), 역할: 대조}
  - {판: 138테뭉침, 이름: 판 138 · 화소(곡면 테 뭉침)}
  - {판: 139다중라벨, 이름: 판 139 · 다중 라벨(닿은 화소 둘 다 정답)}   # 10-23 추가 · 139 판 결과를 본 뒤 넣음(결정 규칙은 그대로)
