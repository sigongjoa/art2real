# 판 145 — 도면 → 우리 인코더(판 137 CNN 선지도 → 벡터화 141~143 규칙 → 선마다 글 한 줄) → cadrille(2B · CadQuery 를 앎) LoRA → CadQuery 글 → 실행 → 실루엣 IoU · 10-24 사용자 「feature extraction 은 잘 되니깐 cadquery 를 output 으로 하는 LLM」 · 비교판 「코드」 참가자
defaults: [바탕, _self_]
판:
  이름: 145선글코드
  가지: B1
  시도: 선 목록을 글로 주고 언어 모델이 CadQuery 코드를 쓰게 한다
  명제: 시험 부품 299 개에서 선 토큰을 글로 받은 cadrille 이 3000 스텝(학습 부품 한 바퀴쯤) LoRA 미세조정 뒤 쓴 CadQuery 코드는 90 % 이상 실행되고, 실행한 모양의 실루엣 IoU 중앙값이 판 127(덩어리 칸 디코더) 의 0.737 을 넘는다
  물음: 선 토큰만 받은 언어 모델이 실행되는 CadQuery 를 쓰나
  종류: 탐색
