# 비교판 「코드」 — 인코더만 바꿔 같은 언어 모델(cadrille LoRA)이 CadQuery 를 쓰게 함 · 우리 인코더(선 토큰) 대 순수 ViT(도면 그림) · 10-24 사용자 「vit · gnn · CNN 결과 비교가 없지 않어?」
비교:
  이름: 코드
  물음: 도면을 언어 모델에 넘길 때 우리 선 토큰이 그림 그대로(ViT)보다 나은 코드를 쓰게 하나
  공통자:
    주지표: 코드_IoU          # 생성 코드를 실행한 모양의 실루엣 IoU 중앙값(시험 299 · 실패 = 0)
    보조: [코드_IoU평균, 코드_실행률]
  시험: 시험 299(번호 ≥ 12000)
  시드: 1                      # 판 하나가 학습 · 생성 · 실행에 몇 시간 — 1 번이면 이김 판정은 보류(흔들림 폭 모름)
  예산: {스텝: 3000}
  결정:
    문턱: 0.05
참가자:
  - {판: 145선글코드, 이름: 선 토큰 → 언어 모델(우리 인코더)}
  - {판: 146도면코드, 이름: 도면 그림 → ViT → 언어 모델(순수 ViT)}
참고: {판 127 덩어리 칸 디코더(코드 아님 · 같은 자): 0.737}
