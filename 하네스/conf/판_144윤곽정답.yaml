  - {지표: 벡_재현_윤곽, 식: ">=", 값: 0.80}
  - {지표: 벡_종류_윤곽, 식: ">=", 값: 0.85}
  - {지표: 벡_F1, 식: ">=", 값: 0.90}
  - {지표: 벡_F1_정답, 식: ">=", 값: 0.90}
