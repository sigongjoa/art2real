# 판 144 — 143 과 같은 벡터화 · 정답에 곡면 테 윤곽선(메시에서 뷰마다 앞면 · 뒷면이 바뀌는 매끈한 이음)을 넣음(벡터화.윤곽정답) · 10-24 사용자 「왜 정답이 틀리고 벡터화가 맞아 보이지?」 → 12050 앞 · 옆 입력 선의 약 20 % 가 정답에 없음(원뿔 빗변 · 구 · 원통 윤곽 = CAD 모서리가 아님)
defaults: [바탕, _self_]
판:
  이름: 144윤곽정답
  가지: A4
  시도: 둥근 면의 윤곽선까지 정답에 넣고 다시 잰다
  명제: 143 과 같은 입력 · 벡터화를, CAD 모서리에 곡면 테 윤곽선을 더한 정답으로 재면 윤곽선의 80 % 이상을 찾고 찾은 윤곽선의 종류(눈 기준)가 0.85 이상 맞으며, 전체 F1 은 0.90 을 지킨다. 같은 계산을 정답 선지도에 돌린 천장 F1 도 0.90 을 넘는다
  물음: 정답에서 빠졌던 둥근 면 윤곽선을 벡터화가 제대로 뽑나
  종류: 탐색
목표: 벡터화
벡터화: {입력판: 137전부합침, 휨문턱: 2.0, 이음: true, 숨메움: true, 윤곽정답: true}
점검: []
